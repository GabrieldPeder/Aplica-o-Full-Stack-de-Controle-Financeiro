# PostgreSQL local para desenvolvimento: `docker compose up -d` dentro de backend/
services:
  banco:
    image: postgres:16
    environment:
      POSTGRES_USER: financas
      POSTGRES_PASSWORD: financas
      POSTGRES_DB: financas
    ports:
      - "5432:5432"
    volumes:
      - dados_financas:/var/lib/postgresql/data
      - ./database/docker-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

volumes:
  dados_financas:
